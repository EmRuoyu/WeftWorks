name: Check static website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated output
        run: |
          python3 scripts/build.py
          git diff --exit-code -- public
      - name: Check links and page contracts
        run: python3 scripts/check.py
